
services:

  server:
        build:
            context: .
            dockerfile: ./automation/docker/Dockerfile
        container_name: server
        volumes:
            - ./:/var/www
#            - cache_volume:/var/www/var/cache  
        restart: always
        # networks:
        #     - MyNetwork   
        links:
            - mysql
        ports:
            - 81:80
        environment:  
#          DATABASE_URL: 'mysql://${MYSQL_USER:-root}:${MYSQL_ROOT_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-green_village}?serverVersion=8.2&charset=utf8mb4'
#           MYSQL_USER: root
# #         MYSQL_PASSWORD: Afpa
#           MYSQL_DATABASE: green_village
#           MYSQL_ROOT_PASSWORD: password
          PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1

  mysql:
    image: mysql:8.2
    container_name: mysql
    restart: always
    environment:
#        MYSQL_USER: root
#        MYSQL_PASSWORD: Afpa
        MYSQL_DATABASE: green_village
        MYSQL_ROOT_PASSWORD: password
        MAILER_DSN: smtp://mailhog:1025
    # healthcheck:
    #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    #     timeout: 5s
    #     retries: 5
    #     start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql
    # networks:
    #   - MyNetwork
    ports:
      - 3307:3306
  
  phpmyadmin:
          image: phpmyadmin/phpmyadmin
          container_name: phpmyadmin
          depends_on:
              - mysql
          restart: always
          environment:
             PMA_HOST: mysql
            #  PMA_USER: root
            #  PMA_PASSWORD: password
            #  MYSQL_USER: root
            #  MYSQL_PASSWORD: Afpa
            # MYSQL_DATABASE: green_village
             MYSQL_ROOT_PASSWORD: password
          links:
              - mysql
        #   networks:
        #       - MyNetwork
          ports:
              - 8095:80

  mailhog:
          image: mailhog/mailhog
          ports:
              - 1025:1025
              - 8025:8025 
          restart: always
          logging:
             driver: 'none'      

volumes:
  mysql_data:          
